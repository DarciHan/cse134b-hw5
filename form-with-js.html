
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="form.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body>
    <header>
        <h1>My Personal Portfolio</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="education.html">Education</a>
            <a href="stories.html">Stories</a>
            <a href="interests.html">Interests</a>
            <a href="form-no-js.html">Contact Form</a>
        </nav>

        <button type="button" id="theme-toggle" hidden>
    Switch to Dark Mode
</button>
    </header>

    <main>
        <h2>Contact Me</h2>
        <p>Fill out the form below to send a message.</p>

        
<form action="https://httpbin.org/post" method="post">

    <label for="name">Name (required):</label>
    <input type="text" id="name" name="name"
           autocomplete="name" required
           minlength="1" maxlength="100" aria-describedby="name-error">
    <p id="name-error" hidden></p>

    <label for="email">Email (required):</label>
    <input type="email" id="email" name="email"
           autocomplete="email" required aria-describedby="email-error">
     <p id="email-error" hidden></p>

    <label for="comments">Comments (required):</label>
    <p id="comments-help">Enter 10 to 1000 characters.</p>
    <textarea id="comments" name="comments"
              rows="6" required
              minlength="10" maxlength="1000"
              aria-describedby="comments-help comments-error"></textarea>
    <p id="comments-error" hidden></p>
    


    <output id="form-errors" aria-live="polite" hidden></output>

    <output id="form-info" aria-live="polite" hidden></output>

    <input type="hidden" name="possible_bot" value="true">

    <input type="hidden" id="form-history" name="form-errors">

    <button type="submit">Send Message</button>

</form>

    </main>

    <footer>
        <a href="index.html">Back to Home</a>
    </footer>
</body>
</html>
